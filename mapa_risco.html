<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gandu Alerta - Mapa de Risco</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #f0f4f8; color: #222; }
  header { background: #c62828; color: #fff; padding: 20px 32px; }
  header h1 { font-size: 28px; }
  header p { opacity: .9; margin-top: 4px; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
  .mapa { background: #e8f5e9; border: 3px solid #2e7d32; border-radius: 12px; position: relative; height: 520px; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .mapa::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, #c8e6c9 25%, #a5d6a7 25%, #a5d6a7 50%, #c8e6c9 50%, #c8e6c9 75%, #a5d6a7 75%);
    background-size: 40px 40px; opacity: .4; }
  .rio { position: absolute; top: 0; left: 55%; width: 60px; height: 100%; background: #4fc3f7; border-radius: 30px; transform: rotate(-8deg); opacity: .7; }
  .rio-label { position: absolute; top: 20px; left: 58%; color: #0277bd; font-weight: bold; font-size: 13px; }
  .escola { position: absolute; top: 60%; left: 20%; font-size: 32px; cursor: pointer; }
  .escola:hover { transform: scale(1.2); }
  .ponto { position: absolute; width: 28px; height: 28px; background: #e53935; border: 3px solid #fff; border-radius: 50%;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: bold; font-size: 13px; transition: transform .15s; }
  .ponto:hover { transform: scale(1.3); }
  .ponto.ativo { background: #b71c1c; transform: scale(1.4); }
  .legenda { position: absolute; bottom: 12px; left: 12px; background: rgba(255,255,255,.95); padding: 10px 14px; border-radius: 8px; font-size: 12px; }
  .legenda div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .bolinha { width: 14px; height: 14px; border-radius: 50%; }
  .painel { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .painel h2 { color: #c62828; font-size: 20px; margin-bottom: 12px; }
  .painel .local { font-size: 18px; font-weight: bold; color: #222; margin-bottom: 4px; }
  .painel .motivo { color: #666; font-size: 14px; margin-bottom: 16px; }
  .painel .dica { background: #fff3e0; border-left: 4px solid #f57c00; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
  .painel .dica strong { color: #e65100; }
  .painel .vazio { color: #999; text-align: center; padding: 40px 20px; font-style: italic; }
  .stats { margin-top: 16px; padding-top: 16px; border-top: 1px solid #eee; font-size: 13px; color: #666; }
  .stats strong { color: #c62828; }
  .btn { display: inline-block; padding: 10px 16px; background: #2e7d32; color: #fff; border: none; border-radius: 6px;
    cursor: pointer; font-weight: bold; margin-top: 12px; width: 100%; font-size: 14px; }
  .btn:hover { background: #1b5e20; }
  .btn.oficina { background: #1976d2; }
  .btn.oficina:hover { background: #0d47a1; }
  .modo { font-size: 12px; color: #1976d2; font-weight: bold; margin-bottom: 8px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } .mapa { height: 400px; } }
</style>
</head>
<body>
<header>
  <h1>🌊 Gandu Alerta</h1>
  <p>Mapa Comunitário de Risco de Enchentes — ODS 13</p>
</header>

<main>
  <div class="mapa" id="mapa">
    <div class="rio"></div>
    <div class="rio-label">Rio Gandu →</div>
    <div class="escola" title="Escola Municipal" style="top: 55%; left: 15%;">🏫</div>
    <div class="escola" title="Escola Municipal" style="top: 75%; left: 40%; font-size: 24px;">🏠</div>

    <div class="ponto" data-id="1" style="top: 20%; left: 30%;">1</div>
    <div class="ponto" data-id="2" style="top: 45%; left: 65%;">2</div>
    <div class="ponto" data-id="3" style="top: 70%; left: 25%;">3</div>
    <div class="ponto" data-id="4" style="top: 35%; left: 45%;">4</div>
    <div class="ponto" data-id="5" style="top: 80%; left: 70%;">5</div>

    <div class="legenda">
      <div><span class="bolinha" style="background:#e53935;"></span> Ponto de alagamento</div>
      <div><span style="font-size:16px;">🏫</span> Escola parceira</div>
      <div><span style="font-size:16px;">🏠</span> Casa de aluno</div>
    </div>
  </div>

  <div class="painel">
    <div class="modo" id="modoLabel">👆 Clique em um ponto vermelho no mapa</div>
    <h2 id="titulo">Mapa de Risco</h2>
    <div id="conteudo">
      <div class="vazio">Selecione um ponto no mapa para ver os detalhes.</div>
    </div>
    <button class="btn oficina" onclick="modoOficina()">🎓 Modo Oficina (aluno)</button>
    <button class="btn" onclick="modoCoordenador()">📊 Modo Coordenador</button>
    <div class="stats" id="stats"></div>
  </div>
</main>

<script>
const pontos = {
  1: { nome: "Rua da Ladeira", motivo: "Rua em declive, sem bueiro. A água desce e acumula na esquina.", dica: "Nunca desça essa rua durante chuva forte. Use a Rua do Meio como rota alternativa." },
  2: { nome: "Ponte do Rio Gandu", motivo: "Rio sobe rápido e transborda. Lixo acumulado no vão da ponte agrava.", dica: "Evite atravessar a ponte após 30 min de chuva forte. Fique em local alto." },
  3: { nome: "Praça Central", motivo: "Calçamento impermeável, sem área verde. A água escoa para a rua de baixo.", dica: "Não estacione na praça em dias de chuva. A água sobe rápido." },
  4: { nome: "Bairro Alto", motivo: "Ocupação em encosta. Risco de deslizamento além de alagamento.", dica: "Observe rachaduras no muro. Se aparecer, saia de casa e ligue 199." },
  5: { nome: "Mercado Municipal", motivo: "Muito lixo e entulho nos bueiros. A água não escoa.", dica: "Não jogue lixo na rua. O bueiro entupido faz a água voltar pra dentro das casas." }
};

let modoAtual = "coordenador";

function mostrarPonto(id) {
  document.querySelectorAll('.ponto').forEach(p => p.classList.remove('ativo'));
  document.querySelector(`.ponto[data-id="${id}"]`)?.classList.add('ativo');

  const p = pontos[id];
  document.getElementById('titulo').textContent = p.nome;

  let html = `<div class="local">${p.nome}</div>`;
  html += `<div class="motivo">${p.motivo}</div>`;
  html += `<div class="dica"><strong>O que fazer:</strong> ${p.dica}</div>`;

  if (modoAtual === "oficina") {
    html += `<div style="background:#e3f2fd;padding:10px;border-radius:6px;font-size:13px;margin-top:12px;">
      ✏️ <strong>Atividade:</strong> Desenhe no seu papel o trajeto da sua casa até a escola e marque com X este ponto. Você passa por ele?
    </div>`;
  }

  document.getElementById('conteudo').innerHTML = html;
}

document.querySelectorAll('.ponto').forEach(p => {
  p.addEventListener('click', () => mostrarPonto(p.dataset.id));
});

function modoOficina() {
  modoAtual = "oficina";
  document.getElementById('modoLabel').textContent = "🎓 MODO OFICINA — alunos clicam e desenham";
  document.body.style.background = "#e3f2fd";
  document.getElementById('stats').innerHTML = "<strong>Modo aluno ativo.</strong> Os pontos mostram o que fazer em cada local.";
}

function modoCoordenador() {
  modoAtual = "coordenador";
  document.getElementById('modoLabel').textContent = "👆 Clique em um ponto vermelho no mapa";
  document.body.style.background = "#f0f4f8";
  document.getElementById('stats').innerHTML = `
    <strong>Resumo do mapeamento:</strong><br>
    Pontos de risco: ${Object.keys(pontos).length}<br>
    Alunos participantes: 30<br>
    Bairros atingidos: 4<br>
    Data da oficina: ___/___/___
  `;
}

modoCoordenador();
</script>
</body>
</html>
